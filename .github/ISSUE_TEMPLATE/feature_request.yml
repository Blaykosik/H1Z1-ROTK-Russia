name: Feature Request / Endpoint Addition
description: Suggest a feature or report an unmapped ROTK server range
title: "[Feature/Endpoint]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please use this template to propose enhancements or report newly identified ROTK server ranges.
        **Do not include any private credentials or account tokens.**

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or improved?
    validations:
      required: true

  - type: textarea
    id: server_details
    attributes:
      label: Server Subnet or Port Details (if applicable)
      description: If proposing a new ROTK server range, provide the IP range and ports observed.
    validations:
      required: false
