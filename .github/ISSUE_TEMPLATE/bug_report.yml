name: Bug Report
description: Report a connectivity issue or unexpected behavior with the bypass
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ CRITICAL PRIVACY & SECURITY WARNING
        **DO NOT POST ANY OF THE FOLLOWING:**
        - Passwords or Steam credentials
        - Auth tokens or ROTK session data
        - VPN / VLESS credentials or configuration files
        - Private keys or personal certificates
        - Full unedited log files containing personal account identifiers

  - type: input
    id: os_version
    attributes:
      label: Windows Version
      placeholder: Windows 11 Pro 64-bit / Windows 10 22H2
    validations:
      required: true

  - type: input
    id: isp_name
    attributes:
      label: Internet Service Provider (ISP) & City
      placeholder: Beeline (Moscow)
    validations:
      required: true

  - type: input
    id: project_version
    attributes:
      label: Project Version
      value: v1.2.1
    validations:
      required: true

  - type: dropdown
    id: lobby_status
    attributes:
      label: Does the Lobby / Title Screen Open?
      options:
        - "Yes, connects normally"
        - "No, hangs or disconnects at login"
        - "Region shows low quality / unavailable"
    validations:
      required: true

  - type: dropdown
    id: match_status
    attributes:
      label: Does the Match Load?
      options:
        - "Yes, loads and plays normally"
        - "No, hangs on loading screen / Waiting for world ready"
        - "Disconnects immediately after zone entry"
        - "Did not test yet"
    validations:
      required: true

  - type: input
    id: ping_observed
    attributes:
      label: Approximate In-Game Ping (ms)
      placeholder: e.g. 55-60 ms
    validations:
      required: false

  - type: textarea
    id: status_output
    attributes:
      label: Output from STATUS.cmd
      description: Run STATUS.cmd and paste the console output here.
      render: text
    validations:
      required: false

  - type: textarea
    id: error_description
    attributes:
      label: Error Description / Observed Symptoms
      description: Describe what happens and any error messages displayed on screen.
    validations:
      required: true
